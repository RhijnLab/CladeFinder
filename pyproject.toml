[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cladefinder-af"
version = "0.3.5"
description = "Local SNP-distance cluster classifier for Aspergillus fumigatus FASTQ data"
requires-python = ">=3.10"
dependencies = []
[project.scripts]
cladefinder = "cladefinder.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
